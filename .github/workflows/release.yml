name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Same sibling layout as ci.yml: the app at kalc/, the foundation beside it.
    # The `files:` globs below resolve against the workspace root, not this
    # working directory — hence the kalc/ prefix.
    defaults:
      run:
        working-directory: kalc
    steps:
      - name: Checkout Kalc
        uses: actions/checkout@v4
        with:
          path: kalc

      - name: Checkout kraft-foundation (composite-build sibling)
        uses: actions/checkout@v4
        with:
          repository: kedharsairam/kraft-foundation
          path: kraft-foundation

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: rename
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Kalc-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kalc ${{ github.ref_name }}
          body: |
            ## Kalc ${{ github.ref_name }}

            ### Install
            1. Download `Kalc-${{ steps.rename.outputs.version }}.apk`
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Notes
            - Release APK is signed with the debug keystore (installable).
            - arm64-only build.
          files: |
            kalc/app/build/outputs/apk/release/Kalc-*.apk
