name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        id: rename
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Kalc-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kalc ${{ github.ref_name }}
          body: |
            ## Kalc ${{ github.ref_name }}

            ### Install
            1. Download `Kalc-${{ steps.rename.outputs.version }}.apk`
            2. Open the file on your Android device
            3. Allow "Install from unknown sources" if prompted

            ### Notes
            - Release APK is signed with the debug keystore (installable).
            - arm64-only build.
          files: |
            app/build/outputs/apk/release/Kalc-*.apk
